[project]
name = "GCM-Python"
dynamic = ["version"]
description = "A textbook, physics-based GCM written in Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.9.2",
    "jaxlib>=0.9.2",
    "xarray>=2024.0",
    "netcdf4>=1.7",
]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.9",
    "cartopy>=0.23",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/gcm"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".coverage",
    ".github/",
    "benchmarks/",
    "CLAUDE.md",
    "docs/",
    "tests/",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "gcm", "scripts", "tests"]
# exclude = ["notebooks/**"]
fix = true
unsafe-fixes = false
preview = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "S",        # bandit security
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "C90",      # mccabe complexity
    "DTZ",      # flake8-datetimez
    "T10",      # flake8-debugger
    "ISC",      # implicit string concat
    "PIE",      # flake8-pie
    "PT",       # flake8-pytest-style
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SLF",      # flake8-self
    "ERA",      # eradicate (commented-out code)
    "PL",       # pylint (PLR, PLC, PLE, PLW)
    "PERF",     # perflint
    "FURB",     # refurb
    "FLY",      # flynt
    "NPY",      # numpy deprecations
    "INP",      # flake8-no-pep420
    "T20",      # flake8-print
    "TID",      # flake8-tidy-imports
    "SLOT",     # flake8-slots
    "LOG",      # flake8-logging
]
fixable = ["ALL"]
extend-ignore = [
    "UP047",    # PEP 695 type parameter syntax (optional style)
    "PLR0913",  # Too many arguments to function call
    "PLR0917",  # Too many positional arguments
    "PLR0914",  # Too many local variables
]
allowed-confusables = [
    "φ", "λ", "μ", "ζ", "δ", "ψ", "χ", "Ω", "Σ", "Δ",  # Greek letters for math
    "π", "κ", "ν", "σ", "τ",
    "²", "³", "⁴", "⁻", "ⁱ",  # Superscripts for equations
    "ₙ", "ₘ", "ₛ", "ₖ", "ᵐ",  # Subscripts
    "→", "·", "∂", "∇", "∫",  # Math operators
    "≤", "≥",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # Use of assert detected
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function (test functions)
    "DOC201",  # Fixtures return via pytest injection
    "D401",    # Imperative mood in docstring
    "PLR2004", # Magic value in comparison (common in test assertions)
    "PLR6301", # Method could be static
    "PLR0904", # Too many public methods
    "SLF001",  # Private member access
    "PLC2701", # Private import from external module
    "PLC0415", # Import not at top level
    "E402",    # Module-level import after pytest.importorskip guard
]

[tool.ruff.lint.isort]
known-first-party = ["gcm"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.13"
packages = ["gcm"]
mypy_path = "src"
exclude = [
    "tests/",
]
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
# JAX stubs return Any for most array operations; disabling this avoids
# hundreds of false positives while keeping all other strict checks active.
warn_return_any = false
warn_unused_configs = true
no_implicit_reexport = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cartopy", "cartopy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["netCDF4", "netCDF4.*"]
ignore_missing_imports = true
